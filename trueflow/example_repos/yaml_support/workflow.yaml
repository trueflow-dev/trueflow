service: billing
metadata:
  owner: platform
  labels:
    tier: backend
    oncall: billing
pipelines:
  - name: ingest
    steps:
      - kind: fetch
        retries: 3
      - kind: decode
        format: csv
  - name: publish
    steps:
      - kind: store
        table: events
alerts:
  high_latency:
    threshold_ms: 500
    destinations:
      - pagerduty
      - slack
