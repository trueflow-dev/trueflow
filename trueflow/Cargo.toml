[package]
name = "trueflow"
version = "0.1.1"
edition = "2024"

[workspace]
resolver = "3"
members = ["test-support"]
default-members = ["."]

[features]
bench = ["dep:criterion"]
tui-test-support = []

[dependencies]
criterion = { version = "0.8.2", optional = true, default-features = false, features = ["cargo_bench_support"] }
anyhow = "1.0.104"
clap = { version = "4.6.2", features = ["derive", "env"] }
chrono = "0.4.45"
ratatui = "0.30.2"
crossterm = "0.29.0"
dirs = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.11.0"
tree-sitter = "0.26.11"
tree-sitter-bash = "0.25.1"
regex = "1.13.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
tree-sitter-rust = "0.24.2"
tree-sitter-typescript = "0.23.2"
url = "2.5.8"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
walkdir = "2.5.0"
tree-sitter-asciidoc = "0.9.0"
tree-sitter-md = { version = "0.5.2", features = ["parser"] }
tree-sitter-nix = "0.3.0"
fs2 = "0.4.3"
unicode-width = "0.1.14"
toml = "0.9.11"
gix = { version = "0.78.0", default-features = false, features = ["revision", "status"] }
schemars = { version = "1.2.0" }
serde_jcs = "0.1.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.22"
ignore = "0.4.25"
toml_edit = "0.25.3"
tree-sitter-swift = "0.7.1"
tree-sitter-java = "0.23.5"
tree-sitter-elisp = "1.6.1"
tree-sitter-c-sharp = "0.23.1"
tree-sitter-ruby = "0.23.1"
tree-sitter-php = "0.24.2"
tree-sitter-c = "0.24.1"
tree-sitter-kotlin-ng = "1.1.0"
tree-sitter-zig = "1.1.2"
tree-sitter-lua = "0.5.0"
tree-sitter-dart = "0.1.0"
tree-sitter-scala = "0.25.0"
tree-sitter-haskell = "0.23.1"
tree-sitter-ocaml = "0.24.2"
tree-sitter-elixir = "0.3.5"
tree-sitter-yaml = "0.7.2"
tree-sitter-json = "0.24.8"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-clojure = { version = "0.2.5", package = "tree-sitter-clojure-orchard" }
tree-sitter-sql = { version = "0.3.11", package = "tree-sitter-sequel" }
tree-sitter-go = "0.25.0"
tree-sitter-cpp = "0.23.4"
async-lsp = { version = "0.2.4", features = ["tokio"] }
tokio = { version = "1.52.4", features = ["io-util", "process", "rt", "sync", "time"] }
tower = "0.5"
tokio-util = { version = "0.7.18", features = ["compat"] }

# [dependencies]
# dioxus = "0.4.3"
# dioxus-tui = "0.4.3"

[dev-dependencies]
portable-pty = "0.9.0"
serde_json = "1.0"
trueflow-test-support = { path = "test-support" }
uuid = { version = "1.24.0", features = ["v4"] }
vt100 = "0.16.2"

[[test]]
name = "e2e_bench_fixture"
required-features = ["bench"]

[[bench]]
name = "full_review"
harness = false
required-features = ["bench"]

[lints]
workspace = true

[workspace.lints.clippy]
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
box_collection = "warn"
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
expect_used = "warn"
fallible_impl_from = "warn"
float_cmp = "warn"
fn_params_excessive_bools = "warn"
from_iter_instead_of_collect = "warn"
implicit_clone = "warn"
index_refutable_slice = "warn"
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
linkedlist = "warn"
manual_assert = "warn"
map_err_ignore = "warn"
match_wild_err_arm = "warn"
mem_forget = "warn"
mutex_atomic = "warn"
needless_pass_by_value = "warn"
option_option = "warn"
rc_buffer = "warn"
redundant_clone = "warn"
semicolon_if_nothing_returned = "warn"
significant_drop_in_scrutinee = "warn"
todo = "warn"
trivially_copy_pass_by_ref = "warn"
unimplemented = "warn"
uninlined_format_args = "warn"
unreachable = "warn"
unwrap_in_result = "warn"
unwrap_used = "warn"
unused_async = "warn"
wildcard_imports = "warn"
